{a:'sms',n:'BBVA-Avisos',av:'B',s:'+52 55 5017 4421',m:[['t','BBVA: Detectamos un cargo de $8,499.00 en TIENDA DE ALPACAS DUBAI. Si no lo reconoces, cancélalo hoy aquí: bbva-mx.cargos-seguros.com/c/48213']],c:1,tip:'El banco no te manda links para "cancelar" cargos y el dominio no es bbva.mx. La tienda de alpacas es absurda a propósito: te asustan primero y piensas después.'},
{a:'sms',n:'DHL-Entregas',av:'D',s:'+52 81 2290 1177',m:[['t','Hola, tu paquete (Tapete de peluche en forma de aguacate x2) no pudo entregarse. Paga $19 de reenvío para programarlo: dhl-envios.mx.co/r/9921']],c:1,tip:'$19 es el gancho: lo que buscan es tu tarjeta. Dominio raro (.mx.co). Si esperas algo, revisa la guía en la app oficial de la paquetería.'},
{a:'sms',n:'Consultorio Dr. Pérez',av:'🦷',s:'33 3615 0042',m:[['me','Hola, quiero agendar limpieza dental porfa'],['t','Consultorio Dr. Pérez: tu cita quedó para mañana 4:30 pm. Responde 1 para confirmar o 2 para reagendar. Cepíllate, aunque sea hoy 🦷']],c:0,tip:'Tú iniciaste la conversación, no hay links ni pagos ni datos sensibles. Rechazarlo te deja sin limpieza dental.'},
{a:'wa',n:'Mamá (nuevo)',av:'?',s:'+52 33 1456 8820 · no está en tus contactos',m:[['t','Hola hijo, soy mamá. Se me cayó el celular al pozole 😭 y me compré otro. Guarda este número.'],['t','¿Me haces un favor? Tengo que pagar el gas y no puedo entrar al banco con este cel. Transfiéreme $3,800 a esta cuenta y te los regreso 🙏']],c:1,tip:'Número desconocido + prisa + dinero. Llama a tu mamá a su número de siempre. El pozole es el detalle ridículo que lo hace creíble.'},
{a:'wa',n:'Ing. Beltrán (Dirección)',av:'B',s:'+1 786 555 0143',m:[['t','Buenos días. Estoy en junta y no puedo hablar. Necesito 5 tarjetas OXXO de $1,000 para un regalo sorpresa a un cliente.'],['t','Mándame fotos de los códigos por aquí. Discreción por favor 🤫']],c:1,tip:'Foto de tu jefe, prisa, secreto y tarjetas de regalo: fraude del falso director. Número extranjero y nadie legítimo pide códigos por chat. Confírmalo en persona.'},
{a:'wa',n:'Memo',av:'M',s:'en tus contactos',m:[['t','Wey ¿sí vas a la carne asada del sábado? Yo llevo la arrachera, tú trae hielos y no te hagas 😂'],['t','Y no me salgas con que se te olvidó otra vez como lo del cumple de Rocío']],c:0,tip:'Habla como tu amigo, hace referencia a algo que solo él sabe y no pide dinero, códigos ni links. Aquí sí: responde.'},
{a:'ig',n:'valentina.dr.cirujana',av:'V',s:'0 seguidores en común · 11 publicaciones',m:[['t','Hola guapo ✨ vi tu foto con el perro en Chapala 🐕'],['t','Soy la Dra. Valentina, cirujana cardiovascular en Dubai y astronauta de reserva 🚀 No sé por qué te escribo, pero siento una conexión'],['t','¿Me pasas tu WhatsApp? Es que aquí no tengo señal en la estación espacial jaja']],c:1,tip:'Perfil nuevo con poco contenido, profesión de película y halagos rápidos: catfishing. Luego vendrá la "emergencia" con petición de dinero.'},
{a:'ig',n:'sorteo.tamales.donalupe',av:'🫔',s:'41.2K seguidores · "Verificada"',m:[['t','🎉 ¡FELICIDADES! Ganaste 1 AÑO DE TAMALES GRATIS (12 docenas al mes)'],['t','Para enviarte el premio responde con tu CLABE y el código de 6 dígitos que te llegará por SMS para comprobar que eres persona real'],['t','⚠️ Tienes 15 min o se lo damos al siguiente ganador']],c:1,tip:'El código SMS es la llave de tu cuenta o de tu banco. Un sorteo real no pide CLABE ni códigos, y la prisa es parte del truco.'},
{a:'x',n:'Soporte X Oficial',av:'X',s:'@SoporteX_Oficiaal · 52 seguidores',m:[['t','@tuusuario Tu cuenta infringió derechos de autor por un tuit de 2019 con un GIF de Shrek 🟢. Apela en 24 horas o será suspendida: x-apelaciones.help/forma/771']],c:1,tip:'Handle con doble "a", pocos seguidores y link externo. El soporte real no te amenaza con plazos por menciones públicas.'},
{a:'gm',n:'Recursos Humanos',av:'R',s:'rh@tu-empresa-mx.com',subj:'Aumento del 12% aprobado 🎉 (confidencial)',m:[['t','Estimado colaborador:\n\nTras evaluar tu desempeño (y que nadie volvió a mencionar el incidente de la impresora), se aprobó tu aumento del 12%.\n\nPara recibirlo valida tus credenciales de nómina antes de las 18:00 h:\n\n[[Validar mi aumento]]\n\nAtte. Depto. de RH']],c:1,tip:'El dominio tu-empresa-mx.com no es el de tu empresa (tuempresa.com.mx). RH no pide credenciales por correo; la ilusión del aumento te nubla.'},
{a:'gm',n:'SAT Notificaciones',av:'S',s:'notificaciones@sat-gob.mx',subj:'Aviso: adeudo de $47.50 pendiente',m:[['t','Contribuyente:\n\nSe detectó una diferencia de $47.50 por ingresos no declarados de la venta de 3 kg de nopales en el tianguis.\n\nPara evitar una multa de $12,000, regulariza hoy:\n\n[[Pagar con tarjeta]]\n\nServicio de Administración Tributaria']],c:1,tip:'Dominio sat-gob.mx (el real es sat.gob.mx). Un adeudo mínimo contra una multa enorme te empuja a pagar sin pensar. El SAT notifica por Buzón Tributario.'},
{a:'gm',n:'Directora Rosa Elena',av:'D',s:'direccion@colegiosanjose.edu.mx',subj:'Festival de Día de Muertos: confirmar participación',m:[['t','Estimados padres:\n\nEl viernes 31 es el festival de Día de Muertos y no habrá clases. Favor de confirmar, respondiendo este correo, si su hijo participará en el baile "La Catrina del Cumbión".\n\nAgradecemos que traigan pan de muerto. Y que nadie se pase de tequila en la kermés.\n\nAtte. Dirección']],c:0,tip:'Remitente y dominio coinciden con tu escuela, el contexto es real y solo piden responder: sin links, pagos ni credenciales.'},
{a:'call',n:'Banorte Seguridad',av:'🏦',s:'+52 55 5140 0000',m:[['t','"Buenas tardes, le habla Marco, del departamento de Fraudes de Banorte. Detectamos que alguien intenta comprar un jacuzzi inflable en Rusia con su tarjeta."'],['t','"Para cancelarlo le acaba de llegar un código por SMS. ¿Me lo lee, por favor? Es urgente, el jacuzzi ya va en camino."']],b:['Leerle el código','Colgar'],c:1,tip:'Vishing. El banco nunca te pide el código SMS: es la llave para autorizar. Aunque el número parezca real (se puede falsear), cuelga y llama al número oficial.'},
{a:'call',n:'Número desconocido',av:'?',s:'+52 33 2201 7788 · pediste tacos hace 12 min',m:[['t','"¿Bueno? Soy el repartidor, ya estoy afuera con sus tacos al pastor. ¿Me abre el portón porque no encuentro el timbre?"']],b:['Contestar y atender','Colgar'],c:0,tip:'Pediste tacos hace poco y solo te piden abrir: sin códigos, dinero ni datos. No todo desconocido es estafa; colgar aquí = tacos fríos.'},
{a:'sms',n:'Telcel-Promos',av:'T',s:'+52 55 9004 1182',m:[['t','Telcel: por ser tu cliente MÁS FIEL (recargaste $10 en 2014) ganaste 50 GB gratis. Reclámalos hoy: telcel-premios.mx/gb50']],c:1,tip:'Premio por una lealtad absurda + link con dominio ajeno. Las promos reales se ven en Mi Telcel, no en links de desconocidos.'},
{a:'sms',n:'Don Pedro Plomero',av:'🔧',s:'33 1890 4467',m:[['me','Don Pedro, ¿cuánto me cobra por arreglar el boiler?'],['t','$850 jefe, mañana a las 10 llego. Pago en efectivo al terminar, no se me adelante con nada. Y si el boiler ya murió le hacemos velorio 🔧']],c:0,tip:'Tú lo contactaste, el precio coincide, paga hasta que termine y no manda links. Responder es lo normal.'},
{a:'sms',n:'Eterno Descanso',av:'⚰️',s:'+52 55 1024 7781',m:[['t','Vimos que ya tiene 35 años y aún no tiene paquete funerario. Contrate hoy con un solo pago de $499 y le regalamos una veladora de por vida: eterno-descanso.shop/pago']],c:1,tip:'Número desconocido, presión emocional (la muerte) y pago por link. Ni la veladora de por vida lo salva.'},
{a:'sms',n:'INE-Avisos',av:'I',s:'+52 55 4410 9035',m:[['t','Tu credencial vence HOY. Si no renuevas dejarás de existir legalmente (pero seguirás pagando impuestos). Agenda cita: ine-renovacion.org/cita']],c:1,tip:'El INE no renueva por SMS ni con links .org. Mezclan humor y miedo para que hagas clic sin pensar.'},
{a:'wa',n:'Miss Lupita (nuevo cel)',av:'L',s:'+52 33 7102 6655 · no está en tus contactos',m:[['t','Buenos días papás de 3°B. Soy la miss Lupita, cambié de cel. Ya hay que pagar la cuota de la excursión al Zoológico, $450 por niño.'],['t','Depositen a mi cuenta personal porque la de la escuela está bloqueada. Quien no pague, su hijo se queda a ver el zoológico en fotos 🦁']],c:1,tip:'Número nuevo, cuenta personal y presión por los niños. Confirma con la escuela por su canal oficial antes de pagar nada.'},
{a:'wa',n:'Mamá',av:'M',s:'en tus contactos',m:[['t','Mijo ya llegué a la misa. ¿Vas a querer pozole o menudo el domingo?'],['t','Contesta antes de que lo decida sin ti 😤']],c:0,tip:'Es su número de siempre y pregunta algo cotidiano: sin dinero, códigos ni links. Contéstale, o habrá menudo.'},
{a:'wa',n:'Elektra Premios',av:'E',s:'+52 55 6600 1200',m:[['t','¡FELICIDADES! Ganaste una pantalla de 75 pulgadas por ser cliente frecuente. Para el envío paga $390 de flete: elektra-premiosmx.com/pantalla'],['t','Si no pagas hoy, la pantalla se la damos a tu vecino, el del perro que ladra']],c:1,tip:'Nadie regala una pantalla pidiendo flete. Se cobra poco para robar tu tarjeta. Revisa promos en la app oficial de la tienda.'},
{a:'wa',n:'Vanessa RH Remoto',av:'V',s:'+52 998 220 4471',m:[['t','Hola 😊 Gana $3,500 diarios dando like a videos de gatitos 🐱 desde tu casa, sin experiencia.'],['t','Solo depositas $1,000 para activar tu cuenta de gatitos, y el primer pago te llega en 24 h. Cupos limitados, el último chamba fue un señor de Tonalá que ya se compró una lancha']],c:1,tip:'Trabajos que piden depósito para "activar tu cuenta" son fraude. Si te cobran por trabajar, no es empleo, es estafa.'},
{a:'wa',n:'Soporte WhatsApp',av:'W',s:'+52 33 5022 8901',m:[['t','Su cuenta de WhatsApp caducará mañana por antigüedad (tiene 14 años y ya es senior).'],['t','Para renovarla, envíe el código de 6 dígitos que le llegó por SMS. Si no, perderá sus 3,000 fotos de memes']],c:1,tip:'WhatsApp no caduca cuentas ni te escribe por chat. Ese código SMS es para entrar a TU cuenta, no se comparte con nadie.'},
{a:'ig',n:'cap.mauricio.oil',av:'⚓',s:'3 seguidores en común · 14 publicaciones',m:[['t','Hola hermosa, soy el ingeniero Mauricio, trabajo en una plataforma petrolera en el Golfo. Llevo 2 meses sin ver tierra ni mujer, ya me aburrí de los peces 🐟'],['t','Me urge que me ayudes con $12,000 para el permiso de desembarque. En cuanto llegue te compro unos tacos y nos casamos']],c:1,tip:'Fotos de galán, trabajo lejano y aislado, cariño rápido y luego dinero: romance scam. La propuesta de matrimonio sobra.'},
{a:'ig',n:'tacoselguero_oficial',av:'🌮',s:'Cuenta creada hace 2 días · 120 seguidores',m:[['t','¡Hola! Te elegimos como embajador de Tacos El Güero 🌮 Te mandamos 20 tacos gratis al mes.'],['t','Solo necesitas pagar $600 del envío del kit de bienvenida (incluye delantal y una salsa roja que mata)']],c:1,tip:'Cuenta nueva, pago "de envío" por adelantado y prometen mucho. Las marcas reales no cobran por ser embajador.'},
{a:'ig',n:'pau.mtz',av:'P',s:'amiga · siguen mutuamente',m:[['t','jajaja mira este reel 😂 se parece a tu tío cuando le dan el micrófono en las bodas'],['t','¿se lo mando a la prima o mejor no?']],c:0,tip:'Es tu amiga, habla con referencias propias y no pide nada. Responde antes de que lo mande a toda la familia.'},
{a:'ig',n:'ig_soporte_comunidad',av:'📛',s:'0 publicaciones · sin foto de perfil',m:[['t','Tu cuenta será eliminada por infringir normas: tu foto del perro con sombrero de charro ofende a la comunidad canina.'],['t','Verifica tu identidad en 1 hora: ig-verifica.mx/ayuda']],c:1,tip:'Cuenta sin publicaciones, motivo ridículo y plazo corto. Instagram avisa dentro de la app, no por DM con links externos.'},
{a:'ig',n:'artesanias.tlaquepaque',av:'🏺',s:'Tienda local · 2.4K seguidores',m:[['me','Hola, quiero la cazuela de barro mediana, ¿hacen envíos?'],['t','Claro, $380 con envío. Le paso la guía de rastreo cuando salga. Gracias por apoyar al comercio local 🏺']],c:0,tip:'Tú iniciaste la compra, el precio coincide con lo hablado y no hay presión ni datos sensibles. Responder es lo correcto.'},
{a:'x',n:'Inversiones Don Chema',av:'$',s:'@donchema_inversion · 700 seguidores',m:[['t','Duplica tu dinero en 1 hora, GARANTIZADO por el Banco del Tianguis. Mi tío invirtió $500 y ya compró una lancha 🚤 Escríbeme por DM con tu tarjeta.']],c:1,tip:'Rendimientos imposibles, garantías de nombre inventado y testimonios de lanchas. Si sube tu dinero tan rápido, es porque baja el de otros.'},

function lst(k){scr.className='sc';scr.innerHTML=sb()+`<div class="hd" style="background:${A[k][2]};color:#fff"><button class="bk" onclick="home()">‹</button>${A[k][0]}</div><div class="bd" style="padding:0">`+S.map((s,i)=>s.a!=k?'':`<button class="row" ${i in res?'disabled':''} onclick="chat(${i})"><div class="av">${s.av}</div><div style="flex:1;min-width:0"><b>${s.n}</b><div class="pv">${s.subj||s.m[0][1]}</div></div>${i in res?(res[i]?'✅':'❌'):'<i class="dt"></i>'}</button>`).join('')+'</div>'}
const ft=i=>{const b=S[i].b||['Responder','Rechazar'];return `<div class="ft"><button class="y" onclick="decide(${i},0)">${b[0]}</button><button class="n" onclick="decide(${i},1)">${b[1]}</button></div>`}
function chat(i){const s=S[i],k=s.a,bub=s.m.map(([w,t])=>`<div class="bu ${w}">${fmt(t)}${k=='wa'?`<small>9:4${w=='me'?0:1} ${w=='me'?'✓✓':''}</small>`:''}</div>`).join('');
scr.className='sc sk-'+k;let bd;
if(k=='gm')bd=`<h3 style="font-weight:500">${s.subj}</h3><div class="sr"><div class="av" style="background:#ea4335">${s.av}</div><div><b>${s.n}</b><br><small>${s.s} · para: yo</small></div></div><div class="em">${fmt(s.m[0][1])}</div>`;
else if(k=='x')bd=`<small style="color:#71767b;margin-bottom:8px">Mención · te mencionó</small><div class="tw"><div class="av" style="background:#1d9bf0">${s.av}</div><div><b>${s.n}</b> <span style="color:#1d9bf0">✔</span><div class="g">${s.s}</div><div style="margin:6px 0;font-size:14px">${fmt(s.m[0][1])}</div><div class="g">💬 12 &nbsp;🔁 3 &nbsp;♥ 41</div></div></div>`;
else bd=bub;
scr.innerHTML=sb()+`<div class="hd"><button class="bk" onclick="lst('${k}')">‹</button><div class="av">${s.av}</div><div>${s.n}<small>${s.s}</small></div></div><div class="bd">${bd}</div>`+ft(i)}
function ring(i){const s=S[i];scr.className='sc cl';scr.innerHTML=sb()+`<div class="av" style="width:84px;height:84px;font-size:34px;margin-top:50px;animation:pl 1s infinite">${s.av}</div><h2 style="margin-top:12px">${s.n}</h2><small>${s.s}</small><p style="opacity:.7;margin-top:8px">Llamada entrante…</p><div class="cb"><div><button class="rc" style="background:#ef4444" onclick="decide(${i},1)">📵</button><br><small>Colgar</small></div><div><button class="rc" style="background:#22c55e" onclick="talk(${i})">📞</button><br><small>Contestar</small></div></div>`}
function talk(i){const s=S[i];scr.innerHTML=sb()+`<h3 style="margin-top:20px">${s.n}</h3><small>${s.s} · 00:07</small><small style="opacity:.6;margin:10px 0 4px">Subtítulos en vivo</small><div class="bd">${s.m.map(([w,t])=>`<div class="bu t">${t}</div>`).join('')}</div>`+ft(i)}
function mc(){const c=S.map((s,i)=>i).filter(i=>S[i].a=='call'&&!(i in res));if(!c.length)return 0;const n=Object.keys(res).length,non=S.filter((s,i)=>s.a!='call'&&!(i in res)).length;if(n%6==3||!non){ring(c[0]);return 1}return 0}
function md(h){const d=document.createElement('div');d.className='md';d.id='md';d.innerHTML=`<div class="cd">${h}</div>`;$('.ph').appendChild(d)}
function cn(i){$('#md').remove();if(!mc()){const a=S[i].a;a!='call'&&pend(a).length?lst(a):home()}}
function decide(i,ch){const s=S[i],ok=ch==s.c;res[i]=ok;let p;
if(ok){stk++;best=Math.max(best,stk);p=100+(stk>=3?50:0)}else{stk=0;p=-75}
sc+=p;hud();tcheck();
md(`<div style="font-size:40px;text-align:center">${ok?'✅':'❌'}</div><h3 style="text-align:center">${ok?'¡Bien visto!':(s.c?'Era una trampa':'Era legítimo')}</h3><p style="text-align:center;font-weight:700;color:${ok?'#16a34a':'#dc2626'}">${p>0?'+':''}${p} pts${ok&&stk>=3?' · racha 🔥':''}</p><p style="font-size:12.5px;margin:8px 0 12px">${s.tip}</p><button onclick="cn(${i})">Continuar</button>`)}
function tcheck(){const v=Object.values(res),g={n:v.length,ok:v.filter(x=>x).length,bad:v.filter(x=>!x).length};
T.forEach(t=>{if(!tr.includes(t[1])&&t[3](g)){tr.push(t[1]);ST('cs_tr',JSON.stringify(tr));toast('🏆 Trofeo: '+t[1])}})}
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3000)}
function panel(w){const p=$('#pn');if(p.dataset.w==w&&!p.hidden){p.hidden=true;return}p.dataset.w=w;p.hidden=false;
p.innerHTML=w=='tr'?T.map(t=>`<div class="tc${tr.includes(t[1])?'':' l0'}"><span>${t[0]}</span><b>${t[1]}</b>${t[2]}</div>`).join(''):['#2b2d42','#e11d48','#2563eb','#16a34a','#f59e0b','#a855f7','#f5f5f4','#0ea5e9'].map(c=>`<button class="sw" style="background:${c}" onclick="setC('${c}')" aria-label="Color ${c}"></button>`).join('')+'<input type="color" oninput="setC(this.value)" aria-label="Color personalizado">'}
function setC(c){document.documentElement.style.setProperty('--ph',c);ST('cs_c',c)}
const c0=ST('cs_c');if(c0)setC(c0);hud();home();
</script></body></html>
